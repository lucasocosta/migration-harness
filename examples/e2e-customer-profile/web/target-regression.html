<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>React target regression fixture</title></head>
<body>
  <main>
    <h1>Customer Profile — Target regression</h1>
    <label>Email <input aria-label="Email" id="email" value="old@example.com"></label>
    <button id="save">Salvar</button>
    <p id="status" role="status"></p>
  </main>
<script>
  document.querySelector('#save').addEventListener('click', async () => {
    const email = document.querySelector('#email').value;
    const response = await fetch('https://app.example.test/api/customers/123', {
      method: 'POST', // intentional regression: source uses PUT
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({email})
    });
    if (response.ok) {
      document.querySelector('#status').textContent = 'Salvo';
    }
  });
</script>
</body>
</html>
