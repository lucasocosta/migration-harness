name: Validate harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack resolves the pinned packageManager (pnpm@10.15.0) from package.json and must
  # never stop for the interactive download prompt inside CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

defaults:
  run:
    # Bash on all three OSes (Git bash ships on windows-latest). Test execution no longer uses
    # POSIX `$(...)` word lists or inline TAP parsing: `scripts/run-tests.mjs` (pure Node) owns
    # the group lists, concurrency and the named skip allowlist, so Linux/macOS/Windows run the
    # exact same commands (PLAN-V2 §5 — no per-OS shell divergence).
    shell: bash

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # CRLF decision (PLAN-V2 §5; docs/OS-PORTABILITY.md registers CRLF↔beforeHash as a known
      # risk): the harness hashes real bytes, so we deliberately do NOT add a .gitattributes with
      # `eol=lf` — it would rewrite files that tests hash. Conservative option instead: run the
      # checkout with core.autocrlf=false. All three OSes then see byte-for-byte what is in the
      # index, hashes match across platforms, and the final `git diff --exit-code` cannot
      # false-positive on line-ending conversion.
      - name: Pin checkout bytes (no CRLF conversion)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP for the api-first example
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
      - name: Install JDK 21 for the api-first example
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned package manager and dependencies
        # `corepack pnpm` (not bare `pnpm`): corepack ships with the Node installed above and
        # reads the pinned version from package.json — no global npm install needed.
        run: corepack pnpm install --frozen-lockfile
      - name: Check dependency advisories
        if: runner.os == 'Linux'
        run: corepack pnpm audit --audit-level=moderate
      - name: Check published documentation links
        # Local git+filesystem check (no network): runs on the whole matrix, not just Linux.
        run: corepack pnpm check:docs
      - name: Portability lint
        run: corepack pnpm check:portability
      - name: Build
        run: corepack pnpm build
      - name: Install and preflight Chromium
        # Essential-guarantee preflight on every OS: if Chromium cannot launch anywhere in the
        # matrix, this step fails loudly right here instead of letting the layers go green on
        # mass skips (PLAN-V2 §5 — clear refusal, never an invisible skip).
        run: |
          corepack pnpm exec playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch(); await browser.close();"
      - name: Test manifest partition and invariants
        # `check` proves EXECUÇÃO, not filenames: the union of the `test()` selected per layer
        # covers every `test()` of every file with name selection (migration-operations is split
        # between L1 and L3 after the final-audit P1 hole), the file partition is exact, the skip
        # allowlist points at real tests and tests/INVARIANTS.md matches the canonical map. Any
        # divergence fails the build here.
        run: node tests/test-groups.mjs check
      - name: L1 tests (fast layer, serial)
        # `scripts/run-tests.mjs` is pure Node (portable in the default Windows shell): it builds
        # the file list from the manifest, runs `node --test` with the layer concurrency and applies
        # the NAMED skip allowlist. L1 includes the `l1-operations` subset of migration-operations
        # (no prepare/verify); the complement runs in L3. A skip outside `SKIP_ALLOWLIST` in
        # tests/test-groups.mjs fails the step on every OS — the old reason-text/POSIX exemption is
        # gone. Missing Chromium or toolchains are NOT declared: the preflight above owns them, so
        # a skip there is a regression.
        run: node scripts/run-tests.mjs l1
      - name: L2 tests (integration, concurrency 2)
        run: node scripts/run-tests.mjs l2
      - name: L3 tests (browser + heavy, serial)
        # tests/browser/* plus the complete prepare/verify flows, including the migration-operations
        # complement (stale-evidence tests 96-116 and preflight-only 118-133). Chromium was
        # preflighted above; each file already skips cleanly by test where a platform lacks a
        # feature, and those skips must be declared in the allowlist.
        run: node scripts/run-tests.mjs l3
      - name: Exclusive tests (serial)
        run: node scripts/run-tests.mjs exclusive
      - name: Verify checks preserved the checkout
        # Runs on all three OSes now (was Linux-only): with core.autocrlf=false pinned before
        # the checkout, the tree is byte-identical to the index everywhere, so `git diff` cannot
        # false-positive on CRLF conversion (decision documented in the first step).
        run: |
          git diff --exit-code
          others=$(git ls-files --others --exclude-standard)
          if [ -n "$others" ]; then
            echo 'Checks left untracked files behind:'
            echo "$others"
            exit 1
          fi
